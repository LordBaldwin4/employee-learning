server {
    listen 80;
    listen [::]:80;

    # Remplacez ces valeurs par l'IP statique et le domaine réels.
    server_name YOUR_STATIC_IP YOUR_DOMAIN;

    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        include proxy_params;
        proxy_pass http://unix:/run/project_d.sock;
    }
}
