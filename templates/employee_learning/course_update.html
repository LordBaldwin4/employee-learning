{% extends 'base/base.html' %}
{% load crispy_forms_tags %}
{% block title %}Modifier le cours | Employee Learning Hub{% endblock %}
{% block body_class %}page-course-form{% endblock %}
{% block body %}
<div class="container my-5" style="max-width: 640px;">
    <div class="card shadow-sm border-0"><div class="card-body p-4 p-md-5">
        <h1 class="h2 mb-4">Modifier le cours</h1>
        <form method="post">{% csrf_token %}{{ form|crispy }}<button type="submit" class="btn btn-primary w-100 mt-3">Enregistrer</button></form>
    </div></div>
</div>
{% endblock %}
